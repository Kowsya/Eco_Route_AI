# ---------------------------------------------------------------
# CI/CD pipeline: test -> build Docker image -> push -> deploy to Cloud Run
# Triggered on every push to the main branch.
# Required GitHub repository SECRETS (Settings > Secrets and variables > Actions):
#   GCP_PROJECT_ID   your GCP project id
#   GCP_SA_KEY       JSON key of the deployer service account (see GUIDE.md, Phase 9)
# ---------------------------------------------------------------
name: CI-CD EcoRoute AI

on:
  push:
    branches: [ "main" ]

env:
  REGION: asia-south1            # Mumbai region (closest to you)
  SERVICE: ecoroute-ai           # Cloud Run service name
  REPO: ecoroute-repo            # Artifact Registry repository name

jobs:
  # ---------- JOB 1: run automated tests ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4                 # download the repository code
      - uses: actions/setup-python@v5             # install Python 3.11
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt      # install dependencies
      - run: pytest -v                            # run tests/test_api.py (fails pipeline if a test fails)

  # ---------- JOB 2: build image and deploy (only if tests passed) ----------
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Log in to Google Cloud using the service-account key stored as a GitHub secret
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # Let Docker push images to Artifact Registry
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Build the image, tagged with the commit id (so every version is traceable)
      - name: Build image
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

      # Deploy the new image to Cloud Run with deliberate resource limits
      - name: Deploy to Cloud Run
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}
          gcloud run deploy ${{ env.SERVICE }} \
            --image $IMAGE \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --max-instances 3 \
            --concurrency 20 \
            --cpu 1 --memory 512Mi \
            --service-account ecoroute-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
